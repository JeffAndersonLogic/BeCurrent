name: Apply Topic 3 sequence fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic3-sequence-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply Topic 3 sequence corrections
        run: python scripts/patch-topic3-sequence.py

      - name: Rebuild Iran and teacher-facing generated materials
        run: |
          node scripts/build-iran.js
          node scripts/build-lesson-plans.js
          node scripts/build-canvas-events.js

      - name: Verify generated materials and page contracts
        run: |
          node scripts/build-iran.js --check
          node scripts/build-lesson-plans.js --check
          node scripts/build-canvas-events.js --check
          node scripts/test/iran-unit.test.js
          node scripts/validate.js

      - name: Commit Topic 3 corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Topic 3 already contains the requested corrections."
            exit 0
          fi
          git config user.name "BeCurrent Topic 3 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add iran/topic-03-1979.html scripts/lib/unit-content/iran.js assets/js/iran-topics.js assets/data/iran-unit.js docs/lesson-plans docs/canvas
          git commit -m "Fix Topic 3 sequence and add Iran origins context"
          git push origin HEAD:main
