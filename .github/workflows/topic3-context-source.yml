name: Align Topic 3 context source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/topic3-context-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Align Topic 3 canonical source
        run: python scripts/patch-topic3-context-source.py

      - name: Rebuild Iran and generated teacher materials
        run: |
          node scripts/build-iran.js
          node scripts/build-lesson-plans.js
          node scripts/build-canvas-events.js

      - name: Verify
        run: |
          node scripts/build-iran.js --check
          node scripts/build-lesson-plans.js --check
          node scripts/build-canvas-events.js --check
          node scripts/test/iran-unit.test.js
          node scripts/validate.js

      - name: Commit aligned source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Topic 3 source already aligned."
            exit 0
          fi
          git config user.name "BeCurrent Topic 3 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add iran/topic-03-1979.html scripts/lib/unit-content/iran.js assets/js/iran-topics.js assets/data/iran-unit.js docs/lesson-plans docs/canvas
          git commit -m "Align Topic 3 origins context with lesson source"
          git push origin HEAD:main
