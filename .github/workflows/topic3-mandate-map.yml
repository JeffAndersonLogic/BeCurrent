name: Apply Topic 3 mandate map

on:
  push:
    branches: [topic3-mandate-map]
    paths:
      - '.github/workflows/topic3-mandate-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: topic3-mandate-map

      - name: Restore uploaded classroom map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/iran
          { head -c 18000 tmp/mandates_webp_00.b64; head -c 17816 tmp/mandates_webp_01.b64; } | base64 -d > assets/images/iran/mandates-1920.webp
          echo '9a19ee9fd65fd80841f857c2e1c182acd79752809243ac02efa7280e44b2514f  assets/images/iran/mandates-1920.webp' | sha256sum -c -

      - name: Patch Topic 3
        run: python scripts/patch-topic3-mandate-map.py

      - name: Rebuild generated Iran materials
        run: |
          node scripts/build-iran.js
          node scripts/build-lesson-plans.js

      - name: Verify
        run: |
          node scripts/build-iran.js --check
          node scripts/test/iran-unit.test.js
          node scripts/validate.js

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp
          rm scripts/patch-topic3-mandate-map.py
          rm .github/workflows/topic3-mandate-map.yml
          git config user.name 'BeCurrent Topic 3 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add mandate system map to Topic 3'
          git push origin HEAD:topic3-mandate-map
