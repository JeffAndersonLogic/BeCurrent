name: Temporary Rich Copy Fix

on:
  push:
    branches:
      - fix/rich-canvas-paste-formatting

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rich-canvas-paste-formatting
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply rich-copy patch
        run: python3 scripts/temp-rich-copy-fix.py
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Rebuild generated pages
        run: |
          node scripts/build-iran.js
          node scripts/build-units.js
          node scripts/build-weeks.js
      - name: Verify rich formatting paths
        run: |
          grep -q 'font-size:24pt' assets/js/iran-topics.js
          grep -q 'font-size:24pt' social-media/topic-03-brief-the-algorithm.html
          grep -q "'text/html': new Blob" assets/js/becurrent-week-renderer-v1.js
          npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/iran-topic-page.js scripts/lib/brief-capture-block.js assets/js/becurrent-week-renderer-v1.js assets/js/iran-topics.js social-media week-01
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Preserve rich formatting in Canvas clipboard pastes"
            git push origin HEAD:fix/rich-canvas-paste-formatting
          fi
