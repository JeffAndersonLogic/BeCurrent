name: Sync generated lesson and Canvas docs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/unit-content/**'
      - 'scripts/build-lesson-plans.js'
      - 'scripts/build-canvas-events.js'
      - '.github/workflows/generated-docs-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: becurrent-generated-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build generated teacher and Canvas docs
        run: |
          node scripts/build-lesson-plans.js
          node scripts/build-canvas-events.js

      - name: Verify generated docs
        run: |
          node scripts/build-lesson-plans.js --check
          node scripts/build-canvas-events.js --check

      - name: Commit generated files when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/lesson-plans docs/canvas; then
            echo "Generated docs already in sync."
            exit 0
          fi
          git config user.name "BeCurrent Generated Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/lesson-plans docs/canvas
          git commit -m "Sync generated lesson and Canvas docs"
          git push origin HEAD:main
