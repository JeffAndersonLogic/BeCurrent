name: Sync generated lesson and Canvas docs

# Keeps teacher-facing lesson plans, Canvas artifacts, and Iran browser/video
# payloads aligned with the same canonical sources that drive student lessons.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/lib/unit-content/**'
      - 'scripts/lib/iran-video-content.js'
      - 'scripts/lib/iran-topic-page.js'
      - 'scripts/build-lesson-plans.js'
      - 'scripts/build-canvas-events.js'
      - 'scripts/build-iran-videos.js'
      - 'scripts/build-iran.js'
      - '.github/workflows/generated-docs-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: becurrent-generated-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build generated lesson, Iran, and Canvas artifacts
        run: |
          node scripts/build-iran-videos.js
          node scripts/build-iran.js
          node scripts/build-lesson-plans.js
          node scripts/build-canvas-events.js

      - name: Verify generated artifacts
        run: |
          node scripts/build-iran-videos.js --check
          node scripts/build-iran.js --check
          node scripts/build-lesson-plans.js --check
          node scripts/build-canvas-events.js --check

      - name: Commit generated files when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/js/iran-topics.js assets/data/iran-unit.js assets/data/iran-videos.js docs/lesson-plans docs/canvas; then
            echo "Generated artifacts already in sync."
            exit 0
          fi
          git config user.name "BeCurrent Generated Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/iran-topics.js assets/data/iran-unit.js assets/data/iran-videos.js docs/lesson-plans docs/canvas
          git commit -m "Sync generated lesson and Canvas docs"
          git push origin HEAD:main
