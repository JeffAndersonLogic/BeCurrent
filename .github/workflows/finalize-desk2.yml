name: Finalize Desk 2 candidate

on:
  push:
    branches:
      - chatgpt/desk-2-newsroom

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore publication home and fix Desk contracts
        run: |
          git fetch origin main
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          let html = execFileSync('git', ['show', 'origin/main:index.html'], { encoding: 'utf8' });

          const wireUrls = [
            'https://apnews.com/article/810649a0a4143d9042094626c4a36dad',
            'https://apnews.com/article/d88f76c1d91b11185ae4065f85abc2f9',
            'https://apnews.com/article/8fdcfa56f35b9eac2399fe1d167f8fbd',
            'https://apnews.com/article/41ac797399040746c2caa76a409ae580'
          ];
          wireUrls.forEach(url => {
            html = html.replace(`<a href="${url}"`, `<a data-daily-wire href="${url}"`);
          });

          html = html.replace(/<a class="briefing-item"([^>]*)>([\s\S]*?)<\/a>/g, (m, attrs, inner) => {
            inner = inner.replace('<div class="meta">', '<div class="meta" data-brief-meta>');
            inner = inner.replace('<h3>', '<h3 data-brief-title>');
            inner = inner.replace('<p>', '<p data-brief-dek>');
            return `<a class="briefing-item" data-daily-briefing${attrs}>${inner}</a>`;
          });
          html = html.replace(/· AP</g, '· Associated Press<');
          html = html.replace('<span>Current Wire reviewed August 26, 2026.</span>', '<span data-daily-reviewed>Current Wire reviewed August 26, 2026.</span>');
          html = html.replace('<script src="assets/js/becurrent-2.js"></script>', '<script src="assets/data/daily-news.js"></script>\n<script src="assets/js/daily-news-hydrate.js"></script>\n<script src="assets/js/becurrent-2.js"></script>');

          fs.mkdirSync('scripts/lib', { recursive: true });
          fs.writeFileSync('scripts/lib/publication-home.html', html, 'utf8');
          fs.writeFileSync('index.html', html, 'utf8');

          const builder = `#!/usr/bin/env node\n'use strict';\n\n/**\n * Build the publication-first BeCurrent front door from its locked source template.\n * Current headlines hydrate in the browser from assets/data/daily-news.js, so the\n * publication shell stays stable while the daily news file remains the one small\n * teacher-maintained current layer.\n */\nconst fs = require('fs');\nconst path = require('path');\nconst ROOT = path.resolve(__dirname, '..');\nconst SOURCE = path.join(ROOT, 'scripts', 'lib', 'publication-home.html');\nconst TARGET = path.join(ROOT, 'index.html');\nconst CHECK = process.argv.includes('--check');\nconst content = fs.readFileSync(SOURCE, 'utf8');\nconst existing = fs.existsSync(TARGET) ? fs.readFileSync(TARGET, 'utf8') : '';\nif (CHECK) {\n  if (existing !== content) {\n    console.error('\\nindex.html has drifted from scripts/lib/publication-home.html.');\n    console.error('Run: node scripts/build-index.js\\n');\n    process.exit(1);\n  }\n  console.log('✓ index.html reproduces exactly from the publication template.');\n  process.exit(0);\n}\nif (existing === content) console.log('✓ index.html already up to date.');\nelse { fs.writeFileSync(TARGET, content, 'utf8'); console.log('  wrote index.html'); }\n`;
          fs.writeFileSync('scripts/build-index.js', builder, 'utf8');

          let desk2 = fs.readFileSync('assets/js/desk-2.js', 'utf8');
          desk2 = desk2.replace("const META_PREFIX='becurrent-desk-meta-';", "const META_PREFIX='becurrent-meta-desk-';");
          desk2 = desk2.replace(
            "return Object.values(state).some(v=>v&&typeof v.answer==='string'&&v.answer.trim());",
            "return Object.entries(state).some(([key,v])=>/-(?:what|why)$/.test(key)&&v&&typeof v.answer==='string'&&v.answer.trim());"
          );
          fs.writeFileSync('assets/js/desk-2.js', desk2, 'utf8');

          let capture = fs.readFileSync('assets/js/desk-capture-v2.js', 'utf8');
          capture = capture.replace(
            "return fieldIds().some(function (id) { return String((dayState[id] || {}).answer || '').trim(); });",
            "return LANES.some(function (lane) { return QUESTIONS.some(function (q) { var id = lane.id + '-' + q.id; return String((dayState[id] || {}).answer || '').trim(); }); });"
          );
          fs.writeFileSync('assets/js/desk-capture-v2.js', capture, 'utf8');

          let hydrate = fs.readFileSync('assets/js/daily-news-hydrate.js', 'utf8');
          hydrate = hydrate.replace('const briefing=[lead].concat(wire.slice(0,3));', 'const briefing=wire.slice(0,4);');
          fs.writeFileSync('assets/js/daily-news-hydrate.js', hydrate, 'utf8');

          let test = fs.readFileSync('scripts/test/desk.test.js', 'utf8');
          test = test.replace(
            "const typed = 'The town council voted to rezone the parcel on Oak Street.\\n\\n'\n      + 'Two of the five members had asked for a delay the week before.';",
            "const typed = 'The town council voted to rezone the parcel on Oak Street.\\n\\n'\n      + 'Three council members had asked for a delay the week before.';"
          );
          fs.writeFileSync('scripts/test/desk.test.js', test, 'utf8');

          fs.rmSync('.github/workflows/finalize-desk2.yml', { force: true });
          NODE

          node scripts/build-index.js --check
          node scripts/run-tests.js offline
      - name: Commit candidate fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Desk 2 for production"
          git push origin HEAD:chatgpt/desk-2-newsroom
