name: Iran last-minute rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iran-last-minute-bootstrap.yml'
      - '.bootstrap/iran-revision-*.b64'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore reviewed Iran revision
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/iran-revision-*.b64 > /tmp/iran-revision.b64
          base64 -d /tmp/iran-revision.b64 > /tmp/iran-revision.tar.gz
          echo '5693004296e7f0040d5a85807c8d40ee0ec9722cd1016a3e9e7fa83c30cb5e4f  /tmp/iran-revision.tar.gz' | sha256sum -c -
          tar -xzf /tmp/iran-revision.tar.gz

      - name: Restore eight-stop Reverse History journey
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('iran/index.html')
          s = p.read_text()
          if 'class="ir-stop"' in s:
              raise SystemExit('Iran landing page already contains an ir-stop journey; refusing to duplicate it')
          rail = '\n'.join([
              '<section class="ir-section" id="journey" aria-labelledby="journey-title">',
              '  <div class="ir-head"><div class="ir-kicker">The Reverse History route</div><div><h2 id="journey-title">Start with the war. Then keep asking what made the next step possible.</h2><p>You are not memorizing eight isolated topics. Each stop adds a piece of the causal chain you will weigh on the final day.</p></div></div>',
              '  <div class="ir-rail" aria-label="Iran at War Reverse History topic sequence">',
              '    <a class="ir-stop active" href="index.html"><div class="year">2026</div><strong>1 · The War Now</strong><span>Who is fighting, where is the pressure, and what still needs explaining?</span></a>',
              '    <a class="ir-stop" href="topic-02-1953.html"><div class="year">NOW ←</div><strong>2 · The Road to War</strong><span>What does FRONTLINE explain—and what historical questions remain?</span></a>',
              '    <a class="ir-stop" href="topic-03-1979.html"><div class="year">1979 ← 1953</div><strong>3 · Origins of Distrust</strong><span>Which transformed U.S.-Iran relations more: revolution or intervention?</span></a>',
              '    <a class="ir-stop" href="topic-04-security.html"><div class="year">1980–88</div><strong>4 · Security Strategy</strong><span>How did invasion and vulnerability shape deterrence and regional partnerships?</span></a>',
              '    <a class="ir-stop" href="topic-05-nuclear.html"><div class="year">2015 → 2018</div><strong>5 · The Nuclear Bargain</strong><span>Why did a negotiated limit form, and what changed when the bargain broke?</span></a>',
              '    <a class="ir-stop" href="topic-06-escalation.html"><div class="year">2024–26</div><strong>6 · Open Escalation</strong><span>When did shadow conflict become direct state-to-state war?</span></a>',
              '    <a class="ir-stop" href="topic-07-hormuz.html"><div class="year">HORMUZ</div><strong>7 · Geographic Leverage</strong><span>How does one narrow waterway turn geography into military and economic power?</span></a>',
              '    <a class="ir-stop" href="topic-08-synthesis.html"><div class="year">WHY?</div><strong>8 · Decide</strong><span>When did this war really begin—and which turning point deserves the most weight?</span></a>',
              '  </div>',
              '</section>',
              ''
          ])
          match = re.search(r'</div>\s*</main>', s, re.I)
          if not match:
              raise SystemExit('could not locate Iran landing-page shell close before </main>')
          s = s[:match.start()] + rail + s[match.start():]
          p.write_text(s)
          PY

      - name: Keep Canvas identifiers aligned
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-canvas-events.js')
          s = p.read_text()
          replacements = {
              "IR1: { name: 'IR1 - The War They Are Watching', points: 20 },": "IR1: { name: 'IR1 - The War Now', points: 20 },",
              "IR2: { name: 'IR2 - The 1953 Coup', points: 20 },": "IR2: { name: 'IR2 - The Road to War', points: 20 },",
              "IR3: { name: 'IR3 - Revolution and Hostages', points: 20 },": "IR3: { name: 'IR3 - 1979 and 1953 Origins', points: 20 },",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected Canvas identifier: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Rebuild every derived surface
        shell: bash
        run: |
          set -euo pipefail
          npm run build:iran
          npm run build:plans
          npm run build:board
          npm run build:canvas
          node scripts/check-iran-videos.js

      - name: Validate global structure
        run: node scripts/validate.js

      - name: Validate revised Iran contract
        run: node scripts/test/iran-unit.test.js

      - name: Validate remaining offline contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test/weeks-reproducible.test.js
          node scripts/test/video-block.test.js
          node scripts/test/canvas-paragraphs.test.js
          node scripts/test/canvas-zip.test.js
          node scripts/test/canvas-events.test.js
          git diff --check

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Validate browser contracts
        run: node scripts/run-tests.js browser --strict

      - name: Validate Iran Topic 1 on Chromium
        run: node scripts/test/iran-topic1.test.js

      - name: Publish coherent revision to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .github/workflows/iran-last-minute-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Revise Iran unit around FRONTLINE Reverse History'
          git push origin HEAD:main
