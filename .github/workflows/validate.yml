name: Validate

# The gate. Every push and every pull request, on any branch.
#
# Two jobs on purpose, because the checks have different dependency stories.
# `structure` runs on a bare checkout with no `npm install` at all, which is the
# same guarantee validate.js is written to hold, and it finishes in seconds.
# `browser` needs Chromium, so it is slower and installs one package.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Structure and offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Structure, capture wiring, reproducibility, Canvas round trip
        run: node scripts/run-tests.js offline

  browser:
    name: Browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Modal focus, scroll lock, deck, capture round trip
        run: node scripts/run-tests.js browser --strict

      - name: Iran Topic 1 launch smoke test
        run: node scripts/test/iran-topic1.test.js
