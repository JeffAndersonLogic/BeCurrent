const state={day:0,phase:-1,mode:'normal',elapsed:0,running:false,tick:null};
function mins(m){if(state.mode==='tight')return Math.max(5,Math.round(m*.72));if(state.mode==='emergency')return Math.max(4,Math.round(m*.52));return m}
function key(){return 'becurrent-iran-ros-'+DAYS[state.day].n}
function save(){localStorage.setItem(key(),JSON.stringify({phase:state.phase,mode:state.mode,elapsed:state.elapsed,notes:notes.value}))}
function load(){state.running=false;clearInterval(state.tick);state.elapsed=0;state.phase=-1;state.mode='normal';const raw=localStorage.getItem(key());if(raw)try{const x=JSON.parse(raw);state.phase=x.phase??-1;state.mode=x.mode||'normal';state.elapsed=x.elapsed||0;notes.value=x.notes||''}catch(e){}render()}
function renderDays(){days.innerHTML=DAYS.map((d,i)=>`<button class="${i===state.day?'active':''}" data-day="${i}"><strong>Topic ${d.n}</strong><span>${d.date} · ${d.title}</span></button>`).join('');days.querySelectorAll('button').forEach(b=>b.onclick=()=>{save();state.day=+b.dataset.day;load()})}
function renderPhases(){const d=DAYS[state.day];const arr=[{id:'must',label:'Must-Haves',m:0},...d.phases];phases.innerHTML=arr.map((p,i)=>`<button class="${i===state.phase+1?'active':''} ${i===0?'must':''} ${i>0&&i<state.phase+1?'done':''}" data-p="${i-1}"><span class="n">${i===0?'Reference':'Phase '+i}</span><span class="lbl">${p.label}</span><span class="rng">${i===0?'Open anytime':mins(p.m)+' min target'}</span></button>`).join('');phases.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.phase=+b.dataset.p;state.elapsed=0;state.running=false;clearInterval(state.tick);save();render()})}
function renderMain(){const d=DAYS[state.day];pageTitle.textContent=`Topic ${d.n} · ${d.title}`;date.textContent=d.date;question.textContent=d.q;endTarget.textContent=d.end;quick.innerHTML=`<a href="${d.lesson}" target="_blank">Open student lesson</a><a href="../iran/study-guide.html" target="_blank">Iran study guide</a><a href="../index.html" target="_blank">BeCurrent home</a>`;if(state.phase<0){mainCard.innerHTML=`<div class="kicker">Reference · Must-Haves</div><h2>${d.title}</h2><p class="meta">${d.date} · Topic ${d.n} of 8</p><p>Open this tab first if you need to know what absolutely has to land today. Everything else is negotiable.</p><div class="must-grid"><section><h3>Land These Ideas</h3><ul>${d.must.land.map(x=>`<li>${x}</li>`).join('')}</ul></section><section><h3>Protect These Moves</h3><ul>${d.must.protect.map(x=>`<li>${x}</li>`).join('')}</ul></section></div><div class="box cut"><strong>If time is tight</strong><ul>${d.must.cut.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="nav"><button disabled>Previous</button><button class="primary" id="nextBtn">Start Phase 1</button></div>`;document.getElementById('nextBtn').onclick=()=>{state.phase=0;state.elapsed=0;save();render()};return}const p=d.phases[state.phase];mainCard.innerHTML=`<div class="kicker">Phase ${state.phase+1} · ${mins(p.m)} min target</div><h2>${p.label}</h2><div class="box"><strong>Land this</strong><div>${p.land}</div></div><h3>Teacher Move</h3><p>${p.move}</p><div class="box ask"><strong>Ask</strong><div>${p.ask}</div></div><div class="box listen"><strong>Listen for</strong><div>${p.listen}</div></div><div class="box filing"><strong>Student filing</strong><div>${p.filing}</div></div><div class="links">${(p.links||[]).map((x,i)=>`<a class="${i?'secondary':''}" href="${x[1]}" target="_blank">${x[0]}</a>`).join('')}</div><div class="nav"><button id="prevBtn">Previous</button><button class="primary" id="nextBtn">${state.phase===d.phases.length-1?'Back to Must-Haves':'Next Phase'}</button></div>`;prevBtn.onclick=()=>{state.phase=Math.max(-1,state.phase-1);state.elapsed=0;save();render()};nextBtn.onclick=()=>{state.phase=state.phase===d.phases.length-1?-1:state.phase+1;state.elapsed=0;save();render()}}
function renderMode(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)))}
function renderTimer(){const d=DAYS[state.day],p=state.phase>=0?d.phases[state.phase]:null;const sec=state.elapsed;timer.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');const targetSec=p?mins(p.m)*60:0;target.textContent=p?`${mins(p.m)} min target`:'Reference';timerLabel.textContent=state.running?'Class time running':'Phase target';if(!p){pace.textContent='Reference';pace.className='pace';return}const ratio=targetSec?sec/targetSec:0;pace.textContent=ratio<.82?'On pace':ratio<1?'Wrapping up':'Move on';pace.className='pace'+(ratio>=1?' late':ratio>=.82?' warn':'')}
function render(){renderDays();renderPhases();renderMain();renderMode();renderTimer()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;save();render()});start.onclick=()=>{if(state.phase<0)return;state.running=true;clearInterval(state.tick);state.tick=setInterval(()=>{state.elapsed++;renderTimer();if(state.elapsed%5===0)save()},1000);renderTimer()};pause.onclick=()=>{state.running=false;clearInterval(state.tick);save();renderTimer()};resetTimer.onclick=()=>{state.running=false;clearInterval(state.tick);state.elapsed=0;save();renderTimer()};newClass.onclick=()=>{if(confirm('Clear timer, phase progress, and notes for this topic?')){localStorage.removeItem(key());notes.value='';state.phase=-1;state.elapsed=0;state.mode='normal';load()}};notes.addEventListener('input',save);load();
</script></body></html>
