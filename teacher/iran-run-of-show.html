<script>
const DAYS=[
{n:1,date:'Tue · Sept. 8',title:'The War Now',q:'What are we actually trying to explain?',lesson:'../iran/index.html',end:'Students can identify the major actors, locate Hormuz, explain what an Iran-aligned armed partner is, and leave with one question the past must answer.',must:{land:['Iran is a regional power, not an isolated point on a map.','Key actors have different offices and powers.','“Proxy” is a shortcut; Iranian support does not mean identical control over every group.','The Strait of Hormuz converts geography into leverage.'],protect:['Visual orientation before the film','FRONTLINE Part I','Graphic-content warning','One low-load exit ticket'],cut:['Extended discussion','Extra short clips','Detailed note-taking','Any second written task']},phases:[
{id:'orient',label:'Know the Board',m:8,must:true,land:'Give students a visual board before the documentary starts asking them to track names, places, and armed groups.',move:'Open the lesson. Move quickly through the four people cards, the regional-network definition, and the Hormuz map. Keep descriptions to one sentence each. Do not lecture the history yet.',ask:'Who has decision-making power here, and where is the geographic pressure point?',listen:'Trump / Netanyahu / Mojtaba Khamenei / Pezeshkian are not interchangeable roles; Hormuz is the narrow exit from the Gulf.',filing:'No filing. This is cognitive orientation.',links:[['Open Day 1','../iran/index.html'],['People','../iran/index.html#people'],['Map','../iran/index.html#map']]},
{id:'setup',label:'Set the Lens',m:4,must:true,land:'Students know what to watch for without turning the film into a worksheet.',move:'Tell students FRONTLINE is the unit anchor, not the final word. Give only three listening cues: WHO is making decisions? WHAT security fear is being described? WHAT earlier event seems to matter?',ask:'What is the difference between seeing an event and proving why it happened?',listen:'A report can establish events and present interpretations; motives still require evidence.',filing:'No notes required.',note:'Viewer discretion: FRONTLINE warns that the program contains graphic imagery. Preview/skip anything you judge unsuitable for this class.',links:[['Film launch','../iran/index.html#film']]},
{id:'film1',label:'FRONTLINE I',m:55,must:true,land:'Let the documentary build the present-day mental model before students are asked to reverse it.',move:'Play Part I. Pause only for a genuine comprehension problem or a content-safety skip. Near the end of the period’s film window, stop at a natural transition and record the exact timestamp in Class Notes for Thursday.',ask:'No running teacher questions. Protect immersion.',listen:'You are listening for confusion around names, chronology, or geography—not fishing for answers.',filing:'None during film.',links:[['Film launch','../iran/index.html#film']]},
{id:'reset',label:'Reset + Talk',m:10,land:'Turn passive viewing into retrieval without demanding a notes packet.',move:'Give 30 seconds of silence. Then pairs answer: one person, one place, one tension they can now explain better. Take 2–3 whole-room shares.',ask:'What became clearer because you saw the story rather than just read a paragraph about it?',listen:'Specific names, relationships, or geographic mechanisms.',filing:'Still no filing.',links:[['Orientation board','../iran/index.html#people']]},
{id:'exit',label:'One Exit Ticket',m:6,must:true,land:'End with a question that gives the historical unit somewhere to go.',move:'Students write only one response. Do not add a second prompt because there is time left.',ask:'What is one thing about this conflict you understand now—and one thing you still need history to explain?',listen:'The best questions point backward: distrust, revolution, nuclear policy, armed networks, Israel-Iran escalation, Hormuz.',filing:'Filing 1 · Orientation exit ticket. Save once; no Canvas homework.',links:[['Exit ticket','../iran/index.html#exit']]},
{id:'bridge',label:'Bridge',m:2,land:'Thursday feels like Part II of one investigation, not a second movie day.',move:'Close with: “Thursday we finish the present. Monday we start rewinding it.”',ask:'None.',listen:'Students should know there is no notes packet or extra homework.',filing:'None.',links:[['Next day','../iran/topic-02-1953.html']]}]},

{n:2,date:'Thu · Sept. 10',title:'The Road to War',q:'Which part of this story cannot be explained by 2026 alone?',lesson:'../iran/topic-02-1953.html',end:'Students can name one unresolved historical question that pulls the investigation backward to 1979 and 1953.',must:{land:['Retrieval before resuming','FRONTLINE Part II','A source check: documentary = researched interpretation, not an oracle','A single backward-looking question'],protect:['Film time','Recorded resume point','One exit response'],cut:['Long debrief','Extra article reading','Additional clips','Second written response']},phases:[
{id:'retrieve',label:'Retrieve',m:5,must:true,land:'Students reactivate Day 1 before returning to the film.',move:'No recap lecture. Ask for three quick retrievals: one actor, one geography point, one unresolved question. Then show the saved film timestamp.',ask:'What do you remember without reopening yesterday’s page?',listen:'Concrete recall, not perfect detail.',filing:'None.',links:[['Day 2','../iran/topic-02-1953.html']]},
{id:'film2',label:'FRONTLINE II',m:59,must:true,land:'Finish the current-event anchor so every later historical stop answers a question students have already encountered.',move:'Resume at the exact timestamp recorded Tuesday. Let the remainder run with minimal interruption. If the remaining runtime differs, protect the film and the exit; compress the source check first.',ask:'No running worksheet questions.',listen:'Watch for 1953, the Shah, the revolution, armed partners, nuclear diplomacy, and escalation becoming part of the same story.',filing:'None during film.',note:'Same viewer-discretion warning as Day 1.',links:[['Film launch','../iran/topic-02-1953.html#film']]},
{id:'source',label:'Source Check',m:8,land:'Students can respect FRONTLINE without confusing a documentary with a primary source.',move:'Use the brief source box. FRONTLINE synthesizes interviews, archival material, and reporting; later lessons will test pieces of its story against records and data.',ask:'What kind of claim from a documentary would you still want to verify?',listen:'Motive, responsibility, causal weight, disputed decisions.',filing:'No filing.',links:[['Source check','../iran/topic-02-1953.html#source-check']]},
{id:'reverse',label:'Launch the Reverse',m:8,must:true,land:'Make the Reverse History move visible: present consequences first, historical mechanisms next.',move:'Put 2026 → 1979 → 1953 on screen. Do not explain the two years yet. Tell students Monday asks why the United States and Iran became enemies.',ask:'Why might 1979 not be the beginning of this story?',listen:'Students may mention the Shah, intervention, oil, or simply “something happened before.” All are useful hypotheses.',filing:'No filing.',links:[['Reverse bridge','../iran/topic-02-1953.html#reverse']]},
{id:'exit',label:'Historical Question',m:5,must:true,land:'Students generate the question Day 3 is designed to answer.',move:'One response, then stop.',ask:'After the documentary, what historical question most needs an answer before you can explain this war?',listen:'A causal question, not “what is Iran?”',filing:'Filing 1 · Documentary question.',links:[['Exit','../iran/topic-02-1953.html#exit'],['Monday','../iran/topic-03-1979.html']]}]},

{n:3,date:'Mon · Sept. 14',title:'Why the U.S. and Iran Became Enemies',q:'Which transformed the relationship more: 1953 or 1979?',lesson:'../iran/topic-03-1979.html',end:'Students can explain reciprocal historical memory: Iranian grievance around 1953 and American grievance around 1979, then weigh which turning point changed the relationship more.',must:{land:['1979 changed the regime and alliance','The hostage crisis created a durable U.S. grievance','1953 involved documented U.S.-British covert intervention','Neither event makes later war inevitable'],protect:['1979 story','1953 evidence discipline','Reciprocal-memory comparison','Final causal claim'],cut:['Optional hostage clip','Extended biography','Counterfactual rabbit holes']},phases:[
{id:'frame',label:'Start at 2026',m:6,must:true,land:'Students know why they are studying two old dates: both are being tested as explanations for a current relationship.',move:'Reopen one or two student historical questions from Thursday. Put the reverse ribbon on screen: 2026 ← 1979 ← 1953.',ask:'If countries remember different injuries, what might happen when they interpret a new crisis?',listen:'Different threat perceptions, mistrust, incompatible narratives.',filing:'No filing.',links:[['Day 3','../iran/topic-03-1979.html']]},
{id:'rev79',label:'1979',m:20,must:true,land:'A broad anti-Shah revolution becomes an Islamic Republic; different opposition groups did not all want the same future.',move:'Use the Shah/Khomeini portraits and the concise revolution sequence. Keep focus on the alliance collapsing, not every faction of the revolution.',ask:'Why could very different groups oppose the same government?',listen:'Repression, rapid change, inequality, religion, foreign influence—multiple pressures can converge.',filing:'Filing 1 · Revolution.',links:[['1979','../iran/topic-03-1979.html#revolution']]},
{id:'hostages',label:'Hostages + Memory',m:12,land:'The embassy seizure adds a new American grievance that 1953 cannot explain.',move:'Use the static overview first. If the room needs human/political texture and time is healthy, use the teacher-choice PBS excerpt; otherwise keep moving.',ask:'What did the hostage crisis add to the relationship?',listen:'Humiliation, fear, public memory, failed diplomacy, a lasting political symbol.',filing:'Filing 2 · American memory.',links:[['Hostage section','../iran/topic-03-1979.html#hostages']]},
{id:'coup53',label:'Reverse to 1953',m:19,must:true,land:'Mosaddegh, oil nationalization, domestic conflict, and U.S.-British covert action belong in the causal chain without becoming a monocausal explanation.',move:'Use the Mosaddegh card and concise sequence. Play the 6:08 Operation Ajax clip. Then ask what the narrative still needs documentary evidence to establish.',ask:'Why can nationalizing oil become a sovereignty issue, not just an economic one?',listen:'Who controls resources, who chooses government policy, foreign influence.',filing:'Prepare for Filing 3.',links:[['1953','../iran/topic-03-1979.html#coup'],['Video','../iran/topic-03-1979.html#video-forward']]},
{id:'archive',label:'Test the Record',m:12,must:true,land:'Students do not overclaim what a declassified U.S. record proves.',move:'Model “supports / does not support by itself.” Establish foreign participation while preserving Iranian agency and domestic conflict.',ask:'What can this record prove—and what can it not prove by itself?',listen:'It can document U.S. involvement; it cannot prove every Iranian actor’s motive or that Washington alone controlled every outcome.',filing:'Filing 3 · Evidence discipline.',links:[['Evidence','../iran/topic-03-1979.html#evidence']]},
{id:'memory',label:'Two Memories',m:13,must:true,land:'Students see why each society can carry a different “beginning” of hostility.',move:'Place the Iranian 1953 memory next to the U.S. 1979 memory. Then require one connection to later mistrust.',ask:'Which memory would make compromise harder—and for whom?',listen:'Specific actor + event + mechanism.',filing:'Filings 4 · Reciprocal memory.',links:[['Memory','../iran/topic-03-1979.html#memory']]},
{id:'claim',label:'Weigh the Origins',m:3,must:true,land:'The class ends with causal weighing, not chronology.',move:'Students make a provisional choice; they can revise later in the unit.',ask:'Which transformed U.S.-Iran relations more: 1953 or 1979?',listen:'A claim with one mechanism from each event.',filing:'Filing 5 · Claim; gather in Canvas if assigned.',links:[['Claim','../iran/topic-03-1979.html#claim'],['Next','../iran/topic-04-security.html']]}]},

{n:4,date:'Wed · Sept. 16',title:'Why Fight Far From Home?',q:'Is Iran’s regional network better understood as deterrence, power projection, or both?',lesson:'../iran/topic-04-security.html',end:'Students can connect the Iran-Iraq War to later security choices while explaining why “proxy” can overstate Iranian control.',must:{land:['Iraq invaded Iran in 1980','The war shaped perceived vulnerability','IRGC/Quds Force became central security institutions','Armed partners vary in autonomy and goals'],protect:['War experience','Causal mechanism','Proxy-language nuance','Security dilemma'],cut:['Third deep-dive clip','Extended organizational detail','Extra whole-class share']},phases:[
{id:'invasion',label:'Invasion',m:16,must:true,land:'Security strategy starts with a concrete vulnerability problem.',move:'Use the 1980 timeline and selected war footage. Keep the question on lessons leaders might draw from invasion and isolation.',ask:'What lesson might leaders draw from surviving an eight-year invasion?',listen:'Do not fight alone; create deterrence; develop self-reliance; keep threats farther away.',filing:'Filing 1 · Security lesson.',links:[['Invasion','../iran/topic-04-security.html#invasion']]},
{id:'mechanism',label:'IRGC + Mechanism',m:18,must:true,land:'Students can write the actual causal chain instead of saying “the war caused proxies.”',move:'Explain IRGC/Quds Force and asymmetric strategy. Then require: wartime experience → perceived vulnerability → strategic response.',ask:'What is the mechanism connecting the war to later deterrence?',listen:'A chain with intermediate steps.',filing:'Filing 2 · Mechanism.',links:[['IRGC','../iran/topic-04-security.html#irgc']]},
{id:'network',label:'Regional Network',m:18,must:true,land:'Students use “Iran-aligned armed groups” precisely and treat proxy as a question of degree.',move:'Map Hezbollah, Houthis, Iraqi militias, Hamas/PIJ. Emphasize different origins, interests, and levels of Iranian support/control.',ask:'Where does “proxy” help—and where can it mislead?',listen:'Support is not identical to command-and-control.',filing:'Filing 3 · Network evidence.',links:[['Network','../iran/topic-04-security.html#network']]},
{id:'dilemma',label:'Security Dilemma',m:18,must:true,land:'A strategy can be defensive in purpose and threatening in effect.',move:'Put Iran’s deterrence frame opposite U.S./Israeli/Gulf power-projection frame.',ask:'Can both descriptions be true at the same time?',listen:'Students separate purpose, perception, and effect.',filing:'Filing 4 · Perspective.',links:[['Perspective','../iran/topic-04-security.html']]},
{id:'claim',label:'Weigh the War',m:15,must:true,land:'Students assign proportional weight to the Iran-Iraq War without making it destiny.',move:'Require a limit: if the war mattered, what else still needs explanation?',ask:'To what extent can modern Iranian regional strategy be explained by the Iran-Iraq War?',listen:'Mechanism + another cause.',filing:'Filing 5 · Claim; gather.',links:[['Claim','../iran/topic-04-security.html#claim'],['Next','../iran/topic-05-nuclear.html']]}]},

{n:5,date:'Fri · Sept. 18',title:'The Nuclear Bargain',q:'Did the collapse of the nuclear agreement make eventual war substantially more likely?',lesson:'../iran/topic-05-nuclear.html',end:'Students can explain the JCPOA bargain, identify what it did not solve, and test the post-2018 causal chain.',must:{land:['The U.S. once supported Iran’s nuclear program under the Shah','JCPOA traded verified nuclear limits for nuclear-related sanctions relief','The deal did not solve missiles or regional conflict','Withdrawal changed incentives but did not make war inevitable'],protect:['What the deal actually did','IAEA/verification distinction','Post-2018 chain','Policy tradeoff claim'],cut:['Optional current connection clip','Excess technical enrichment detail','Long debate over party politics']},phases:[
{id:'origin',label:'Surprising Origin',m:10,must:true,land:'The nuclear story begins with U.S.-Iran cooperation, complicating a timeless-enemies narrative.',move:'Use the origin section quickly: cooperation under the Shah, then changed relationship after revolution.',ask:'Why does the U.S.-supported origin matter to how we frame the dispute?',listen:'The program and relationship changed over time; conflict was not permanent.',filing:'Filing 1 · Origins.',links:[['Origins','../iran/topic-05-nuclear.html#origins']]},
{id:'deal',label:'What the JCPOA Did',m:20,must:true,land:'Students can describe the bargain accurately before judging it.',move:'Use the required PBS clip and four-move scaffold. Keep enrichment physics secondary.',ask:'What problem did the deal solve, and what did it leave outside?',listen:'Nuclear limits/monitoring vs missiles, armed partners, wider rivalry.',filing:'Filing 2 · JCPOA.',links:[['JCPOA','../iran/topic-05-nuclear.html#jcpoa']]},
{id:'withdrawal',label:'2018 Break',m:22,must:true,land:'Students trace choices after withdrawal rather than treating one action as an automatic war switch.',move:'Build the chain: withdrawal → sanctions → Iranian reduced compliance → expanding nuclear concern → coercive pressure. Make students identify the weakest arrow.',ask:'Which causal arrow is weakest or most dependent on later choices?',listen:'They recognize alternatives existed at multiple steps.',filing:'Filing 3 · Causal chain.',links:[['Withdrawal','../iran/topic-05-nuclear.html#withdrawal']]},
{id:'tradeoff',label:'Policy Tradeoff',m:18,must:true,land:'Students compare imperfect agreement vs abandoning verified limits without being told which policy is correct.',move:'Put critics and defenders into the same risk frame.',ask:'Which risk was larger: accepting an imperfect deal or losing verified limits?',listen:'Evidence-based comparison, not partisan label.',filing:'Filing 4 · Perspective/tradeoff.',links:[['Perspective','../iran/topic-05-nuclear.html']]},
{id:'claim',label:'Weigh 2018',m:15,must:true,land:'Students decide how much explanatory weight the deal’s collapse deserves.',move:'Require at least one other cause in the claim.',ask:'Did the JCPOA collapse substantially increase the risk of war?',listen:'Causal mechanism + limitation.',filing:'Filing 5 · Claim; gather.',links:[['Claim','../iran/topic-05-nuclear.html#claim'],['Next','../iran/topic-06-escalation.html']]}]},

{n:6,date:'Tue · Sept. 22',title:'From Shadow War to Open War',q:'At what point between 2018 and 2026 did full-scale war become most likely?',lesson:'../iran/topic-06-escalation.html',end:'Students can identify a threshold-changing event and explain how repeated retaliation altered later choices.',must:{land:['Shadow conflict allowed rivalry without direct war','2024 direct attacks changed precedent','Escalation can create path dependence without inevitability','A turning point changes the option set, not just the casualty count'],protect:['2024 threshold','At least one later escalation','Restraint vs escalation frame','Turning-point claim'],cut:['Third analysis clip','Every intermediate attack','Extended chronology copying']},phases:[
{id:'shadow',label:'Shadow War',m:12,must:true,land:'Students know why rivals may prefer covert/indirect conflict.',move:'Define the old pattern quickly: covert action, partner groups, cyber, long-range threats—below full direct war.',ask:'Why might rivals prefer a shadow war?',listen:'Plausible deniability, lower escalation risk, lower cost, deterrence.',filing:'Filing 1 · Strategy.',links:[['Shadow','../iran/topic-06-escalation.html#shadow']]},
{id:'threshold',label:'2024 Threshold',m:22,must:true,land:'Direct Iran-Israel state-to-state attack becomes an available response.',move:'Use the required PBS clip and ask what changed even though full war did not immediately follow.',ask:'What precedent did 2024 create?',listen:'Direct attacks were now thinkable/usable.',filing:'Filing 2 · Turning point.',links:[['2024','../iran/topic-06-escalation.html#direct']]},
{id:'ladder',label:'Escalation Ladder',m:20,must:true,land:'Students see path dependence as cumulative pressure, not destiny.',move:'Trace a limited set of rounds. Ask how each response changes expectations and options for the next.',ask:'Does size matter more than precedent?',listen:'They can defend either, but must explain the mechanism.',filing:'Filing 3 · Escalation.',links:[['Escalation','../iran/topic-06-escalation.html#war']]},
{id:'frames',label:'Deterrence Frames',m:16,must:true,land:'The same retaliatory act can be described as restoring deterrence or climbing an escalation ladder.',move:'Contrast the two logics, then ask which better fits the sequence.',ask:'When does deterrence stop restraining and start accelerating?',listen:'Students use sequence evidence.',filing:'Filing 4 · Perspective.',links:[['Perspective','../iran/topic-06-escalation.html']]},
{id:'claim',label:'Pick the Threshold',m:15,must:true,land:'Students choose one moment and address the strongest rival turning point.',move:'Do not accept a list. Make them pick.',ask:'When did full-scale war become most likely?',listen:'One turning point + changed options + counterevidence.',filing:'Filing 5 · Claim; gather.',links:[['Claim','../iran/topic-06-escalation.html#claim'],['Next','../iran/topic-07-hormuz.html']]}]},

{n:7,date:'Thu · Sept. 24',title:'The Hormuz Lever',q:'Is Hormuz primarily military, economic, or diplomatic leverage?',lesson:'../iran/topic-07-hormuz.html',end:'Students can explain the chokepoint mechanism, compare the Tanker War with 2026, and use EIA numbers without turning correlation into motive.',must:{land:['Hormuz is a chokepoint beside Iran','Local threat creates global shipping/energy effects','The 1980s Tanker War provides direct historical context','Data show scale of disruption, not motive'],protect:['Map mechanism','Tanker War comparison','21.6 → 4.9 data literacy','Leverage ranking'],cut:['Second explainer clip','Detailed naval platforms','Long oil-market detour']},phases:[
{id:'map',label:'Chokepoint',m:15,must:true,land:'Students can draw the mechanism from geography to leverage.',move:'Start visually. Narrow route → concentrated shipping → vulnerability to disruption → effects beyond the Gulf.',ask:'Why can a weaker navy still create leverage here?',listen:'Cost asymmetry, mines, missiles, drones, route concentration.',filing:'Filing 1 · Map mechanism.',links:[['Map','../iran/topic-07-hormuz.html#map']]},
{id:'tankers',label:'Tanker War',m:20,must:true,land:'Students connect 2026 to the actual history of Iran-Gulf shipping conflict, not a generic analogy.',move:'Use the 1980s timeline and Operation Earnest Will. Ask for one continuity and one difference.',ask:'What does the Tanker War help explain about 2026?',listen:'Continuity in chokepoint risk/outside intervention; differences in actors, scale, technology, war context.',filing:'Filing 2 · Comparison.',links:[['Tanker War','../iran/topic-07-hormuz.html#tankers']]},
{id:'data',label:'Read the Numbers',m:18,must:true,land:'Students use quantitative evidence with limits.',move:'Put 21.6 million bpd (Q4 2025) beside 4.9 million bpd (Q2 2026). Ask “proves / does not prove.”',ask:'What does this change establish, and what can it not establish?',listen:'Scale of flow disruption yes; motive or sole cause no.',filing:'Filing 3 · Data.',links:[['Today','../iran/topic-07-hormuz.html#today']]},
{id:'perspective',label:'Who Pays?',m:17,must:true,land:'Students see that prolonged disruption imposes costs on Iran and partners as well as adversaries.',move:'Compare incentives of Iran, Gulf exporters, importers, U.S./allies.',ask:'Who has the strongest reason to avoid a prolonged closure?',listen:'A reason tied to trade, revenue, security, or diplomacy.',filing:'Filing 4 · Perspective.',links:[['Perspective','../iran/topic-07-hormuz.html']]},
{id:'claim',label:'Name the Leverage',m:15,must:true,land:'Students rank military/economic/diplomatic leverage rather than calling Hormuz “important.”',move:'Require a ranking and one mechanism.',ask:'What kind of weapon is Hormuz most of all?',listen:'Category + evidence + why other categories rank lower.',filing:'Filing 5 · Claim; gather.',links:[['Claim','../iran/topic-07-hormuz.html#claim'],['Next','../iran/topic-08-synthesis.html']]}]},

{n:8,date:'Mon · Sept. 28',title:'When Did This War Really Begin?',q:'Was the 2026 war mainly recent decisions or decades of unresolved conflict?',lesson:'../iran/topic-08-synthesis.html',end:'Students can distinguish literal start from explanatory beginning, rank causes, and answer the terminal question with evidence and a real counterargument.',must:{land:['Chronology is not causal ranking','A beginning must explain something specific','Evidence should span multiple stops','Counterargument must be the strongest rival explanation'],protect:['Retrieval','Causal chain','Ranking','Final claim'],cut:['New content','Optional current-update clip','Whole-class consensus seeking']},phases:[
{id:'reset',label:'Retrieve',m:10,must:true,land:'Students begin with what they remember before rereading the unit.',move:'On paper/board, retrieve six stops: 1953, 1979, 1980s, nuclear bargain/2018, 2024 escalation, Hormuz. Then reopen pages only to verify details.',ask:'Which stop comes to mind first when you hear “why did war become possible?”',listen:'Initial causal intuition, not gradeable correctness.',filing:'No filing yet.',links:[['Synthesis','../iran/topic-08-synthesis.html']]},
{id:'chain',label:'Build the Chain',m:18,must:true,land:'Students connect events with causal arrows instead of listing dates.',move:'Choose three consecutive stops and force a verb onto each arrow: increased, weakened, legitimized, hardened, expanded, narrowed.',ask:'What changed because of the event before it?',listen:'Mechanism words, not “then.”',filing:'Filing 1 · Causal chain.',links:[['Chain','../iran/topic-08-synthesis.html#chain']]},
{id:'rank',label:'Rank Causes',m:18,must:true,land:'Students prioritize, which is the hardest causal thinking in the unit.',move:'Rank top three turning points. Older is not automatically deeper; newer is not automatically more important.',ask:'Why does #1 do more explanatory work than #2?',listen:'Scope, mechanism, persistence, proximity—all can be weighed.',filing:'Filing 2 · Ranking.',links:[['Ranking','../iran/topic-08-synthesis.html#ranking']]},
{id:'counter',label:'Strongest Rival',m:14,must:true,land:'Counterargument is not a straw man.',move:'Students write the best case for a turning point they did not rank first before rebutting it.',ask:'If your #1 is wrong, what is the strongest alternative?',listen:'A competing explanation with real evidence.',filing:'Filing 3 · Counterargument.',links:[['Counterargument','../iran/topic-08-synthesis.html#counter']]},
{id:'define',label:'Define “Beginning”',m:10,must:true,land:'Students distinguish literal outbreak from explanatory beginning.',move:'Ask what their chosen beginning actually explains: hostility, security strategy, nuclear crisis, direct-war threshold, or global impact.',ask:'What exactly does your beginning explain—and what does it not?',listen:'A bounded claim.',filing:'Filing 4 · Scope.',links:[['Definition','../iran/topic-08-synthesis.html#definition']]},
{id:'final',label:'Final Argument',m:15,must:true,land:'Students answer the terminal question with evidence from at least three stops.',move:'Write. Do not add a class debate if it costs writing time. The unit ends with individual causal judgment.',ask:'Was the war mainly recent decisions, or decades of unresolved conflict?',listen:'Thesis + 3 evidence points + mechanism + counterargument.',filing:'Filing 5 · Final claim; gather and submit.',links:[['Final claim','../iran/topic-08-synthesis.html#claim']]}]}
];

let dayIndex=0,phaseIndex=0,mode='normal',elapsed=0,running=false,started=0,tick=null;
const $=s=>document.querySelector(s), daysEl=$('#days'), phasesEl=$('#phases'), main=$('#mainCard');
function mins(m){if(mode==='tight')return Math.max(2,Math.round(m*.78));if(mode==='emergency')return Math.max(2,Math.round(m*.58));return m}
function renderDays(){daysEl.innerHTML='';DAYS.forEach((d,i)=>{const b=document.createElement('button');b.className=i===dayIndex?'active':'';b.innerHTML=`<strong>Day ${d.n} · ${d.title}</strong><span>${d.date}</span>`;b.onclick=()=>{dayIndex=i;phaseIndex=0;elapsed=0;running=false;render()};daysEl.appendChild(b)})}
function renderPhases(){const d=DAYS[dayIndex];phasesEl.innerHTML='';d.phases.forEach((p,i)=>{const b=document.createElement('button');b.className=(i===phaseIndex?'active ':'')+(i<phaseIndex?'done ':'')+(p.must?'must':'');b.innerHTML=`<span class="n">Phase ${i+1}</span><strong>${p.label}</strong><span>${mins(p.m)} min</span>`;b.onclick=()=>{phaseIndex=i;elapsed=0;running=false;render()};phasesEl.appendChild(b)})}
function renderMust(){const d=DAYS[dayIndex], labels=[['LAND',d.must.land],['PROTECT',d.must.protect],['CUT FIRST',d.must.cut]];$('#must').innerHTML=labels.map(([h,arr])=>`<section><h5>${h}</h5><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></section>`).join('')}
function renderQuick(){const d=DAYS[dayIndex];$('#quick').innerHTML=`<a href="${d.lesson}">Open today’s student page</a><a href="../announcements.html">Open TODAY board</a><a href="../iran/study-guide.html">Open Iran study guide</a>`}
function renderMain(){const d=DAYS[dayIndex],p=d.phases[phaseIndex];$('#pageTitle').textContent=`Day ${d.n} · ${d.title}`;$('#date').textContent=d.date;$('#question').textContent=d.q;$('#endTarget').textContent=d.end;const note=p.note?`<div class="content-note"><strong>Content / logistics note</strong><div>${p.note}</div></div>`:'';const links=(p.links||[]).map(([t,u],i)=>`<a${i?' class="secondary"':''} href="${u}">${t} →</a>`).join('');main.innerHTML=`<section><div class="phase-head"><div><div class="kicker">Day ${d.n} · Phase ${phaseIndex+1}</div><h2>${p.label}</h2><div class="meta">${d.date} · ${mode.toUpperCase()} pacing</div></div><span class="timechip">${mins(p.m)} MIN</span></div><p class="lede"><strong>Land:</strong> ${p.land}</p><div class="teacher-move"><strong>Teacher move</strong>${p.move}</div>${note}<div class="teacher-move ask"><strong>Ask</strong>${p.ask}</div><div class="teacher-move listen"><strong>Listen for</strong>${p.listen}</div><div class="teacher-move filing"><strong>Student filing</strong>${p.filing}</div>${mode!=='normal'?`<div class="teacher-move cutbox"><strong>${mode==='tight'?'Tight-mode discipline':'Emergency-mode discipline'}</strong>${mode==='tight'?'Keep the protected idea and written response; shorten discussion and transitions.':'Land the essential idea, protect any marked filing, and cut extensions without apology.'}</div>`:''}<div class="links">${links}</div><div class="navrow"><button id="prev">← Previous</button><button class="primary" id="next">${phaseIndex===d.phases.length-1?'Next day →':'Next phase →'}</button></div></section>`;$('#prev').onclick=prev;$('#next').onclick=next}
function renderNotes(){const key=`bc-iran-runshow-notes-${DAYS[dayIndex].n}`;$('#notes').value=localStorage.getItem(key)||'';$('#notes').oninput=e=>localStorage.setItem(key,e.target.value)}
function render(){renderDays();renderPhases();renderMain();renderMust();renderQuick();renderNotes();resetTimer(false);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}
function prev(){if(phaseIndex>0){phaseIndex--}else if(dayIndex>0){dayIndex--;phaseIndex=DAYS[dayIndex].phases.length-1}elapsed=0;running=false;render()}
function next(){if(phaseIndex<DAYS[dayIndex].phases.length-1)phaseIndex++;else if(dayIndex<DAYS.length-1){dayIndex++;phaseIndex=0}elapsed=0;running=false;render()}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function currentElapsed(){return running?elapsed+(Date.now()-started)/1000:elapsed}
function updateTimer(){const target=mins(DAYS[dayIndex].phases[phaseIndex].m)*60,e=currentElapsed(),remain=target-e;$('#timer').textContent=fmt(e);$('#target').textContent=`Target ${fmt(target)}`;const pace=$('#pace');pace.className='pace'+(remain<0?' late':remain<120?' warn':'');pace.textContent=remain<0?`${fmt(-remain)} over`:remain<120?`${fmt(remain)} left`:'On pace'}
function startTimer(){if(running)return;running=true;started=Date.now();clearInterval(tick);tick=setInterval(updateTimer,500);updateTimer()}
function pauseTimer(){if(!running)return;elapsed=currentElapsed();running=false;clearInterval(tick);updateTimer()}
function resetTimer(hard=true){clearInterval(tick);elapsed=0;running=false;if(hard||$('#timer'))updateTimer()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;elapsed=0;running=false;render()});$('#start').onclick=startTimer;$('#pause').onclick=pauseTimer;$('#resetTimer').onclick=()=>resetTimer(true);$('#newClass').onclick=()=>{elapsed=0;running=false;phaseIndex=0;localStorage.removeItem(`bc-iran-runshow-notes-${DAYS[dayIndex].n}`);render()};render();
</script>
</body>
